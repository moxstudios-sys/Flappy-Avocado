<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>FLAPPY AVOCADO - NO LOADING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gb-darkest: #0f380f;
            --gb-dark: #306230;
            --gb-light: #8bac0f;
            --gb-lightest: #9bbc0f;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        body {
            background-color: #1a1a1a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Jersey 10', sans-serif;
            overflow: hidden;
            color: var(--gb-darkest);
        }

        #game-wrapper {
            position: relative;
            width: 400px;
            height: 320px;
            background-color: var(--gb-lightest);
            border: 12px solid #333;
            border-bottom-width: 45px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 10px;
            font-size: 38px;
            letter-spacing: 2px;
            z-index: 20;
            background: transparent;
        }

        .screen-text {
            background: var(--gb-lightest);
            padding: 16px;
            border: 4px solid var(--gb-darkest);
            font-size: 32px;
            display: none;
            line-height: 1.1;
            text-transform: uppercase;
            pointer-events: none;
        }

        #countdown-text {
            font-size: 120px;
            color: var(--gb-darkest);
            position: absolute;
            display: none;
            text-shadow: 4px 4px var(--gb-light);
        }

        /* Loading screen - Ajustado a los colores del juego */
        #loading-screen {
            position: absolute;
            inset: 0;
            background: var(--gb-lightest);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #loading-label {
            font-family: 'Jersey 10', sans-serif;
            font-size: 14px;
            color: var(--gb-darkest);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        #loading-bar-wrap {
            width: 160px;
            height: 10px;
            border: 3px solid var(--gb-darkest);
        }
        #loading-bar-fill {
            height: 100%;
            background: var(--gb-darkest);
            width: 0%;
            transition: width 0.05s linear;
        }
        #ready-text {
            font-family: 'Jersey 10', sans-serif;
            font-size: 44px;
            color: var(--gb-darkest);
            letter-spacing: 4px;
            margin-top: 16px;
            display: none;
            animation: blink 0.7s step-end infinite;
        }

        /* Title screen */
        #title-screen {
            position: absolute;
            inset: 0;
            background: var(--gb-lightest);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            pointer-events: none;
            gap: 0px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #title-screen.visible {
            opacity: 1;
        }

        #title-screen svg {
            width: 130px;
            height: auto;
            margin-bottom: 6px;
        }

        #title-game-name {
            font-family: 'Jersey 10', sans-serif;
            font-size: 52px;
            color: var(--gb-darkest);
            text-align: center;
            line-height: 1;
            letter-spacing: 1px;
        }

        #title-click {
            font-family: 'Jersey 10', sans-serif;
            font-size: 22px;
            color: var(--gb-darkest);
            text-align: center;
            margin-top: 10px;
            animation: blink 0.9s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="400" height="320"></canvas>
    
    <div id="ui-layer">
        <div id="score-display" class="hud">000</div>
        <div id="countdown-text">3</div>

    </div>

    <div id="loading-screen">

        <div id="title-click">CLICK TO START</div>

</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const countdownEl = document.getElementById('countdown-text');
const scoreDisplay = document.getElementById('score-display');

const P = { d1: '#0f380f', d2: '#306230', l1: '#8bac0f', l2: '#9bbc0f' };
const COLOR_DARK = "#143511"; 
const COLOR_LIGHT = "#91B31E"; 

const AudioCtx = window.AudioContext || window.webkitAudioContext;
// Create AudioContext immediately — it starts suspended by browser policy
let audioCtx = new AudioCtx();
let musicInterval = null;
let titleMusicInterval = null;

// --- AUDIO SETUP ---

function playTrumpet(isFinal) {
    if(!audioCtx || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; 
    osc.frequency.setValueAtTime(isFinal ? 523.25 : 392.00, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (isFinal ? 0.8 : 0.3));
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + (isFinal ? 0.8 : 0.3));
}

// Game music handled by adaptive startMusic()

// Title screen happy jingle notes - upbeat & cheerful
const TITLE_NOTES = {
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
    G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25,
    D5: 587.33, E5: 659.25, G5: 783.99
};
// Melody: cheerful bouncy tune
const TITLE_MELODY = [
    {n:'E4',d:2},{n:'G4',d:1},{n:'A4',d:2},{n:'G4',d:1},
    {n:'E4',d:2},{n:'C4',d:2},{n:'D4',d:2},{n:'E4',d:2},
    {n:'G4',d:2},{n:'A4',d:2},{n:'B4',d:2},{n:'C5',d:4},
    {n:'B4',d:2},{n:'A4',d:2},{n:'G4',d:2},{n:'E4',d:2},
    {n:'F4',d:2},{n:'G4',d:2},{n:'A4',d:4},{n:'G4',d:2},
    {n:'F4',d:2},{n:'E4',d:2},{n:'D4',d:2},{n:'C4',d:4}
];
// Bass line
const TITLE_BASS = [
    {n:'C4',d:4},{n:'G4',d:4},{n:'A4',d:4},{n:'E4',d:4},
    {n:'F4',d:4},{n:'G4',d:4},{n:'C4',d:8}
];
let titleMelodyIdx = 0;
let titleBassIdx = 0;
let titleBeatCount = 0;
let titleBassCount = 0;

function playTitleTone(freq, type, vol, dur) {
    if(!audioCtx || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function startTitleMusic() {
    if (titleMusicInterval) clearInterval(titleMusicInterval);
    titleMelodyIdx = 0; titleBassIdx = 0;
    titleBeatCount = 0; titleBassCount = 0;

    titleMusicInterval = setInterval(() => {
        if (appState !== 'TITLE') { clearInterval(titleMusicInterval); titleMusicInterval = null; return; }
        // Melody tick
        if (titleBeatCount <= 0) {
            const note = TITLE_MELODY[titleMelodyIdx % TITLE_MELODY.length];
            playTitleTone(TITLE_NOTES[note.n], 'square', 0.07, note.d * 0.12);
            titleBeatCount = note.d;
            titleMelodyIdx++;
        }
        titleBeatCount--;
        // Bass tick
        if (titleBassCount <= 0) {
            const bass = TITLE_BASS[titleBassIdx % TITLE_BASS.length];
            playTitleTone(TITLE_NOTES[bass.n] / 2, 'triangle', 0.05, bass.d * 0.12);
            titleBassCount = bass.d;
            titleBassIdx++;
        }
        titleBassCount--;
        // Percussion
        if ((titleMelodyIdx % 4) === 0) {
            playTitleTone(80, 'sawtooth', 0.04, 0.08);
        }
    }, 100);
}

function stopTitleMusic() {
    if (titleMusicInterval) { clearInterval(titleMusicInterval); titleMusicInterval = null; }
}

function playTone(freq, type, vol, dur) {
    if(!audioCtx || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    currentNote = 0;

    // ── MUSIC DESIGN ────────────────────────────────────────────────────────
    // Score 0–9   : Phase 1 – cheerful, simple melody, slow tempo (280ms/beat)
    // Score 10–24 : Phase 2 – melody + bouncy bass added, same tempo
    // Score 25–44 : Phase 3 – tempo increases to 220ms, arpeggios in melody
    // Score 45–69 : Phase 4 – tempo 170ms, minor-ish tension notes creep in,
    //               high-hat percussion layer added
    // Score 70+   : Phase 5 – full chaos: fast 130ms, dissonant intervals,
    //               saw-wave lead, aggressive percussion

    // All pitches in Hz
    const N = {
        C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
        C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
        C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00,
        Bb3:233.08, Bb4:466.16, Eb4:311.13, Fs4:369.99, Fs5:739.99,
        // Percussion stand-ins
        KICK: 55, HAT: 800, SNARE: 180
    };

    // Phase 1 – happy, major, bouncy (C major)
    const MEL1 = [
        {n:N.E4,d:1},{n:N.G4,d:1},{n:N.C5,d:2},{n:N.B4,d:1},{n:N.A4,d:1},
        {n:N.G4,d:2},{n:N.E4,d:1},{n:N.D4,d:1},{n:N.C4,d:2},{n:N.E4,d:1},{n:N.G4,d:1},
        {n:N.A4,d:2},{n:N.G4,d:1},{n:N.F4,d:1},{n:N.E4,d:2},{n:N.D4,d:2}
    ];
    const BASS1 = [
        {n:N.C3,d:4},{n:N.G3,d:4},{n:N.A3,d:4},{n:N.F3,d:4}
    ];

    // Phase 2 – same melody, bass gets more active
    const BASS2 = [
        {n:N.C3,d:2},{n:N.E3,d:2},{n:N.G3,d:2},{n:N.B3,d:2},
        {n:N.A3,d:2},{n:N.C4,d:2},{n:N.F3,d:2},{n:N.A3,d:2}
    ];

    // Phase 3 – melody with faster arpeggios, more energetic
    const MEL3 = [
        {n:N.C5,d:1},{n:N.E5,d:1},{n:N.G5,d:1},{n:N.E5,d:1},
        {n:N.D5,d:1},{n:N.F5,d:1},{n:N.A5,d:1},{n:N.F5,d:1},
        {n:N.E5,d:1},{n:N.C5,d:1},{n:N.G4,d:1},{n:N.E4,d:1},
        {n:N.D5,d:1},{n:N.B4,d:1},{n:N.G4,d:1},{n:N.D4,d:1}
    ];
    const BASS3 = [
        {n:N.C3,d:1},{n:N.G3,d:1},{n:N.C4,d:1},{n:N.G3,d:1},
        {n:N.F3,d:1},{n:N.C4,d:1},{n:N.F3,d:1},{n:N.C3,d:1}
    ];

    // Phase 4 – tension, minor feel, faster
    const MEL4 = [
        {n:N.E5,d:1},{n:N.Eb4,d:1},{n:N.E5,d:1},{n:N.G5,d:1},
        {n:N.Fs5,d:1},{n:N.E5,d:1},{n:N.D5,d:1},{n:N.C5,d:1},
        {n:N.Bb4,d:1},{n:N.C5,d:1},{n:N.D5,d:1},{n:N.Eb4,d:1},
        {n:N.E5,d:2},{n:N.G5,d:1},{n:N.Fs5,d:1}
    ];
    const BASS4 = [
        {n:N.A3,d:1},{n:N.E3,d:1},{n:N.A3,d:1},{n:N.C4,d:1},
        {n:N.F3,d:1},{n:N.C3,d:1},{n:N.Bb3,d:1},{n:N.F3,d:1}
    ];

    // Phase 5 – chaotic, dissonant, fast
    const MEL5 = [
        {n:N.A5,d:1},{n:N.G5,d:1},{n:N.Fs5,d:1},{n:N.E5,d:1},
        {n:N.Eb4,d:1},{n:N.Fs4,d:1},{n:N.A5,d:1},{n:N.G5,d:1},
        {n:N.Bb4,d:1},{n:N.A5,d:1},{n:N.G5,d:1},{n:N.Fs5,d:1},
        {n:N.E5,d:1},{n:N.D5,d:1},{n:N.Eb4,d:1},{n:N.Fs4,d:1}
    ];
    const BASS5 = [
        {n:N.A3,d:1},{n:N.Eb4,d:1},{n:N.A3,d:1},{n:N.Bb3,d:1},
        {n:N.Fs4,d:1},{n:N.E3,d:1},{n:N.Eb4,d:1},{n:N.D3,d:1}
    ];

    let melIdx = 0, bassIdx = 0, beatCount = 0, bassBeatCount = 0;
    let lastPhase = -1;

    function getPhase() {
        if (score < 10)  return 1;
        if (score < 25)  return 2;
        if (score < 45)  return 3;
        if (score < 70)  return 4;
        return 5;
    }

    function getTempo(phase) {
        return [280, 260, 210, 165, 125][phase - 1];
    }

    function getMelody(phase) {
        return [MEL1, MEL1, MEL3, MEL4, MEL5][phase - 1];
    }

    function getBass(phase) {
        return [BASS1, BASS2, BASS3, BASS4, BASS5][phase - 1];
    }

    function scheduleNote() {
        if (!avocado.alive || state !== 'PLAY') return;

        const phase = getPhase();
        const tempo = getTempo(phase);

        // Phase transition reset
        if (phase !== lastPhase) {
            lastPhase = phase;
            melIdx = 0; bassIdx = 0; beatCount = 0; bassBeatCount = 0;
        }

        const mel = getMelody(phase);
        const bas = getBass(phase);

        // Melody voice
        if (beatCount <= 0) {
            const note = mel[melIdx % mel.length];
            const waveType = phase >= 5 ? 'sawtooth' : phase >= 4 ? 'square' : 'square';
            const vol = phase >= 5 ? 0.10 : phase >= 4 ? 0.08 : 0.07;
            playTone(note.n, waveType, vol, (tempo * note.d * 0.001) * 0.85);
            beatCount = note.d;
            melIdx++;
        }
        beatCount--;

        // Bass voice
        if (bassBeatCount <= 0) {
            const bass = bas[bassIdx % bas.length];
            const bassVol = phase >= 4 ? 0.07 : 0.05;
            playTone(bass.n, 'triangle', bassVol, (tempo * bass.d * 0.001) * 0.75);
            bassBeatCount = bass.d;
            bassIdx++;
        }
        bassBeatCount--;

        // Percussion – starts phase 2, intensifies each phase
        if (phase >= 2) {
            const beat = (melIdx % 8);
            // Kick on beat 0 and 4
            if (beat === 0 || beat === 4) playTone(N.KICK, 'sine', 0.08 + phase * 0.01, 0.12);
            // Snare on beat 2 and 6
            if (beat === 2 || beat === 6) playTone(N.SNARE, 'sawtooth', 0.04 + phase * 0.008, 0.08);
            // Hi-hat every beat from phase 4
            if (phase >= 4) playTone(N.HAT, 'square', 0.025, 0.04);
            // Extra frantic hits on phase 5
            if (phase >= 5 && (beat === 1 || beat === 3 || beat === 5 || beat === 7)) {
                playTone(N.HAT * 1.5, 'sawtooth', 0.015, 0.03);
            }
        }

        // Schedule next note dynamically at current tempo
        if (musicInterval !== null) {
            musicInterval = setTimeout(scheduleNote, tempo);
        }
    }

    // Use timeout chain instead of fixed interval so tempo can change
    musicInterval = setTimeout(scheduleNote, getTempo(1));
}

function stopMusic() {
    if (musicInterval !== null) { clearTimeout(musicInterval); musicInterval = null; }
}

// --- GAME STATE ---
let state = 'START'; 
let score = 0; 
let frames = 0;
let currentSpeed = 2.4; 
let bgX = 0;
let bgAlphaOrg = 1.0; 
let bgAlphaGeo = 0.0;
let bgAlphaChains = 0.0;

let avocado = { x: 70, y: 150, w: 30, h: 40, v: 0, gravity: 0.24, jump: -4.5, alive: true };
let obstacles = [];
let particles = [];

// Paths
const pathAvo = new Path2D("m89.7 56.3v-9.9h-4.7v-4.6h-4.4v-5.1h-5.3v-23.5h-4.7v-4.4h-4.9v-4.4h-32.1v4.4h-5.1v4.4h-4.4v23.5h-4.4v4.9h-5.1v4.8h-4.5v9.6h-4.4v52.3h4.3v9.4h9.6v4.4h9.9-1.1v4.6h42.8-0.6v-4.4h10.2v-4.4h8.9v-9.6h5.3v-52h-5.3z");
const pathFace = new Path2D("m75.1 70.4v-9.6h-4.5v-4.2h-4.9v-5.5h-32.1v5.1h-5.1v4.5h-4.4v9.7h-4.4v18.6h4.4v10h4.4v4.9h9.6v4.4h23.3v-4.5h9.2v-4.8h4.4v-10h5.1v-18.6h-5zm-41.6-4.6h9.6v9h-9.6v-9zm4.5 28.5v-5.3h-4.5v-9.3h4.5v9.3h9.4v5.3h-9.4zm13.7-5.3v5h-4.3v-5h4.3v-4.6h-4.3v4.6h-9.2 9.2v-4.9h4.3v4.9h9.7v-9.3h4.3v9.3h-4.3v5.3h-9.7v-5.3zm14-14.1h-8.9v-9.1h8.9v9.1z");
const pathOrganicMtn = new Path2D("M0,100 Q15,70 30,100 T60,100 T90,100 T120,100 V150 H0 Z");
const pathChainLink = new Path2D("M-20,-10 L20,-10 L28,0 L20,10 L-20,10 L-28,0 Z M-12,-4 L12,-4 L16,0 L12,4 L-12,4 L-16,0 Z");

function drawAvocado(x, y) {
    if (!avocado.alive) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(0.30, 0.30);
    ctx.fillStyle = COLOR_DARK; ctx.fill(pathAvo);
    ctx.fillStyle = COLOR_LIGHT; ctx.fill(pathFace);
    ctx.restore();
}

function drawFork(x, y, h, upsideDown) {
    ctx.fillStyle = P.d2;
    const fw = 28; const hx = x + (fw/2) - 3;
    if (upsideDown) {
        ctx.fillRect(hx, 0, 6, h - 20); ctx.fillStyle = P.d1;
        ctx.fillRect(x, h - 20, fw, 8); for(let i=0; i<4; i++) ctx.fillRect(x + (i * 8), h - 12, 4, 15); 
    } else {
        ctx.fillRect(hx, y + 20, 6, h - 20); ctx.fillStyle = P.d1;
        ctx.fillRect(x, y + 12, fw, 8); for(let i=0; i<4; i++) ctx.fillRect(x + (i * 8), y, 4, 15); 
    }
}

function drawSawCutter(x, gapY, isTop) {
    const bladeX = x + 15; ctx.fillStyle = P.d2;
    if (isTop) ctx.fillRect(bladeX - 6, 0, 12, gapY); else ctx.fillRect(bladeX - 6, gapY, 12, 320 - gapY);
    ctx.save(); ctx.translate(bladeX, gapY); ctx.rotate(frames * 0.25 * (isTop ? 1 : -1));
    ctx.fillStyle = P.d2; const numTeeth = 12; ctx.beginPath();
    for (let i = 0; i < numTeeth; i++) {
        const a = (i / numTeeth) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * 25, Math.sin(a) * 25); ctx.lineTo(Math.cos(a + 0.2) * 38, Math.sin(a + 0.2) * 38);
    }
    ctx.closePath(); ctx.fill(); ctx.fillStyle = P.d1; ctx.fillRect(-6, -6, 12, 12); ctx.restore();
}

function createExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: x + 15, y: y + 20, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 5 + 2, life: 1.0, color: Math.random() > 0.5 ? COLOR_DARK : COLOR_LIGHT
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.035;
        if (p.life <= 0) particles.splice(i, 1);
        else {
            ctx.save(); ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        }
    }
}

function startCountdown() {
    state = 'COUNTDOWN';
    msg.style.display = 'none';
    countdownEl.style.display = 'block';
    let count = 3;
    
    const nextCount = () => {
        if (count > 0) {
            countdownEl.innerText = count;
            playTrumpet(false);
            count--;
            setTimeout(nextCount, 1000);
        } else if (count === 0) {
            countdownEl.innerText = "GO!";
            playTrumpet(true);
            count--;
            setTimeout(nextCount, 800);
        } else {
            countdownEl.style.display = 'none';
            state = 'PLAY';
            startMusic();
        }
    };
    nextCount();
}

function update() {
    if (state === 'PLAY' || state === 'COUNTDOWN' || state === 'START') {
        bgX -= (currentSpeed * 0.25);
    }

    if (state !== 'PLAY') return;
    
    if (avocado.alive) {
        frames++;
        avocado.v += avocado.gravity; avocado.y += avocado.v;
        if (avocado.y + avocado.h > 320 || avocado.y < 0) triggerDeath();

        if (score >= 30 && score < 50) {
            bgAlphaOrg = Math.max(0, bgAlphaOrg - 0.02);
            bgAlphaGeo = Math.min(1.0, bgAlphaGeo + 0.02);
        } else if (score >= 50) {
            bgAlphaGeo = Math.max(0, bgAlphaGeo - 0.02);
            bgAlphaChains = Math.min(1.0, bgAlphaChains + 0.02);
        }

        if (frames % 90 === 0) {
            const targetGap = 110;
            const startingGap = 190;
            let currentGap = (score < 80) ? startingGap - (startingGap - targetGap) * (score / 80) : targetGap;

            if (score >= 50) {
                obstacles.push({ type: 'SAW', x: 440, baseGapY: 160 + (Math.random() * 60 - 30), gapSize: currentGap + 15, phase: Math.random() * Math.PI, scored: false });
            } else {
                const topH = Math.floor(Math.random() * (320 - currentGap - 100)) + 50;
                obstacles.push({ type: 'FORK', x: 400, top: topH, gap: currentGap, scored: false, phase: Math.random() * Math.PI * 2 });
            }
        }

        obstacles.forEach(o => {
            o.x -= currentSpeed;
            if (o.type === 'FORK') {
                let dy = 0; if (score > 10) {
                    o.phase += 0.03; let ampFact = Math.min(1, (score - 10) / 10); dy = Math.sin(o.phase) * (50 * ampFact);
                }
                const curTop = o.top + dy;
                if (avocado.x + 26 > o.x && avocado.x + 4 < o.x + 28) {
                    if (avocado.y + 4 < curTop || avocado.y + 36 > curTop + o.gap) triggerDeath();
                }
            } else {
                o.phase += 0.025; const curGapY = o.baseGapY + Math.sin(o.phase) * 60;
                const topY = curGapY - (o.gapSize / 2); const bottomY = curGapY + (o.gapSize / 2);
                const distT = Math.hypot((avocado.x + 15) - (o.x + 15), (avocado.y + 20) - topY);
                const distB = Math.hypot((avocado.x + 15) - (o.x + 15), (avocado.y + 20) - bottomY);
                const inX = avocado.x + 26 > o.x + 4 && avocado.x + 4 < o.x + 26;
                if (distT < 42 || distB < 42 || (inX && (avocado.y < topY || avocado.y + 36 > bottomY))) triggerDeath();
            }

            if (!o.scored && o.x < avocado.x) {
                score++; 
                scoreDisplay.innerText = score.toString().padStart(3, '0');
                o.scored = true;
                if (score >= 11 && score <= 80) {
                    let speedProg = (score - 11) / (80 - 11);
                    currentSpeed = 2.4 + (speedProg * 2.6); 
                } else if (score > 80) {
                    currentSpeed = 5.0 + ((score - 80) * 0.02);
                }
            }
        });
    }
    obstacles = obstacles.filter(o => o.x > -100);
}

function triggerDeath() {
    if (!avocado.alive) return;
    avocado.alive = false;
    stopMusic();
    playTone(150, 'sawtooth', 0.2, 0.6);
    createExplosion(avocado.x, avocado.y);
    setTimeout(() => { 
        state = 'GAMEOVER'; 
        showUI(`YOU’RE GUAC NOW.<br><span style='font-size: 24px;'>Score ${score.toString().padStart(3, '0')}</span><br><span style='font-size: 16px;'>Click to restart.</span>`); 
    }, 600);
}

function render() {
    ctx.fillStyle = P.l2; ctx.fillRect(0, 0, 400, 320);

    if (bgAlphaOrg > 0) {
        ctx.save(); ctx.globalAlpha = bgAlphaOrg; ctx.fillStyle = P.l1;
        const orgW = 300; let offX = ((bgX % orgW) + orgW) % orgW;
        for (let i = -1; i < 2; i++) {
            ctx.save(); ctx.translate(offX + (i * orgW), -55); ctx.scale(2.5, 2.5);
            ctx.fill(pathOrganicMtn); ctx.restore();
        }
        ctx.restore();
    }

    if (bgAlphaGeo > 0) {
        ctx.save(); ctx.globalAlpha = bgAlphaGeo; ctx.fillStyle = P.l1;
        const geoW = 120; let offX = ((bgX % geoW) + geoW) % geoW;
        for (let i = -1; i < 5; i++) {
            let bx = offX + (i * geoW);
            ctx.beginPath(); ctx.moveTo(bx, 320); ctx.lineTo(bx + 60, 200); ctx.lineTo(bx + 120, 320); ctx.fill();
        }
        ctx.restore();
    }

    if (bgAlphaChains > 0) {
        ctx.save(); ctx.globalAlpha = bgAlphaChains; ctx.fillStyle = P.l1; 
        const spacingX = 120; let baseOffX = ((bgX % spacingX) + spacingX) % spacingX;
        for (let d = -4; d < 5; d++) {
            let startX = baseOffX + (d * spacingX);
            for (let step = -3; step < 13; step++) {
                let x = startX + (step * 30); let y = step * 30;
                ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
                ctx.fill(pathChainLink, 'evenodd'); ctx.restore();
            }
        }
        ctx.restore();
    }
    
    obstacles.forEach(o => {
        if (o.type === 'FORK') {
            let dy = 0; if (score > 10) { let amp = Math.min(1, (score - 10) / 10); dy = Math.sin(o.phase) * (50 * amp); }
            drawFork(o.x, 0, o.top + dy, true); drawFork(o.x, o.top + dy + o.gap, 320 - (o.top + dy + o.gap), false);
        } else {
            const curGapY = o.baseGapY + Math.sin(o.phase) * 60;
            drawSawCutter(o.x, curGapY - (o.gapSize/2), true); drawSawCutter(o.x, curGapY + (o.gapSize/2), false);
        }
    });

    updateParticles();
    drawAvocado(avocado.x, avocado.y);
    requestAnimationFrame(render);
}

function reset() {
    stopMusic();
    score = 0; frames = 0; currentSpeed = 2.4; avocado.y = 150; avocado.v = 0; avocado.alive = true;
    bgAlphaOrg = 1.0; bgAlphaGeo = 0.0; bgAlphaChains = 0.0; bgX = 0;
    obstacles = []; particles = [];
    scoreDisplay.innerText = '000';
    msg.style.display = 'none';
    startCountdown();
}

function showUI(text) { msg.innerHTML = text; msg.style.display = 'block'; }

// --- LOADING SCREEN FLOW ---
const loadingScreen = document.getElementById('loading-screen');
const loadingBarFill = document.getElementById('loading-bar-fill');
const loadingLabel = document.getElementById('loading-label');
const readyText = document.getElementById('ready-text');
const titleScreen = document.getElementById('title-screen');

let appState = 'LOADING'; // LOADING → READY → TITLE → GAME

// Animate the loading bar automatically
let loadPct = 0;
const loadInterval = setInterval(() => {
    loadPct += Math.random() * 18 + 4;
    if (loadPct >= 100) {
        loadPct = 100;
        loadingBarFill.style.width = '100%';
        clearInterval(loadInterval);
        setTimeout(() => {
            loadingLabel.style.display = 'none';
            loadingBarFill.parentElement.style.display = 'none';
            readyText.style.display = 'block';
            appState = 'READY';
        }, 200);
    } else {
        loadingBarFill.style.width = loadPct + '%';
    }
}, 80);

function showTitleScreen() {
    // Fade out loading screen
    loadingScreen.classList.add('fade-out');
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 550);
    // Fade in title screen
    titleScreen.style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => {
        titleScreen.classList.add('visible');
    }));
    startTitleMusic();
    appState = 'TITLE';
}

window.addEventListener('mousedown', (e) => {
    e.preventDefault();

    // Unlock AudioContext on first gesture (browser policy)
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (appState === 'READY') {
        showTitleScreen();
        return;
    }
    if (appState === 'TITLE') {
        stopTitleMusic();
        titleScreen.classList.remove('visible');
        setTimeout(() => { titleScreen.style.display = 'none'; }, 600);
        appState = 'GAME';
        reset();
        return;
    }
    if (appState === 'GAME') {
        if (state === 'GAMEOVER') {
            reset();
        } else if (state === 'PLAY' && avocado.alive) {
            avocado.v = avocado.jump;
            playTone(300, 'square', 0.08, 0.1);
        }
    }
});

setInterval(update, 1000/60);
render();
</script>
